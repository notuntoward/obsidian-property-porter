name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESLint and build
    runs-on: ubuntu-latest

    steps:
      # The plugin resolves the shared library through the local junction
      # "file:../obsidian-commons" (see obsidian-commons docs/MIGRATING.md),
      # so CI must check out both repos as siblings. Commons is pinned to a
      # commit for reproducible builds; update the ref when bumping commons.
      - name: Checkout plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: obsidian-property-porter

      - name: Checkout commons
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: notuntoward/obsidian-commons
          ref: cc70f5ea4cf7c4f290619a974584b20072d8bf03
          path: obsidian-commons

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obsidian-property-porter/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: obsidian-property-porter

      - name: Run ESLint and build
        run: npm run build
        working-directory: obsidian-property-porter
